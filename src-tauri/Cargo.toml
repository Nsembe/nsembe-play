[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "nsembe-play"
version = "0.1.0"
description = "Nsembe Play - a local-first media library and player"
authors = ["Nsembe Play"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "nsembe_play_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nsembe-core = { path = "core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
